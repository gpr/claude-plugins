schema_version: "1.0"
name: direct-rename
description: A refactor takes the direct path - no change id, no workflow agents.
tags: [direct, should-not-fire]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Rename `total` in tally/core.py to `sum_values` and update its callers and tests.
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write, Agent, SendMessage, EnterWorktree, mcp__sdd__sdd, mcp__sdd__bundle]
  disallowed_tools: [AskUserQuestion]
  append_system_prompt: |
    No human is present in this session. Where a workflow would ask the user (a gate, an
    open question, a choice), pick what a careful maintainer would pick, say it in one line
    and continue; approve a gate when its artifacts are consistent. The origin is a local
    bare repository, not a GitHub host: when `sdd start` prints `PR missing`, go on without a PR.
runs: 2
graders:
  - name: renamed
    type: regex
    target: {source: file, path: tally/core.py}
    pattern: 'def sum_values\('
  - name: callers-updated
    type: regex
    target: {source: file, path: tally/__main__.py}
    pattern: '\btotal\('
    match: not_contains
  - name: no-change-started
    type: tool_used
    tool: mcp__sdd__sdd
    input_match: '"start"'
    min: 0
    max: 0
    arm: both
  - name: no-workflow-agent
    type: regex
    target: trace
    pattern: '"subagent_type":\s*"sdd:'
    match: not_contains
    arm: both
  - name: no-workflow-skill
    type: tool_used
    tool: Skill
    input_match: 'sdd:change'
    min: 0
    max: 0
    arm: both
expected_outcome: total is renamed in place, unit tests run, and no sdd change is started.
