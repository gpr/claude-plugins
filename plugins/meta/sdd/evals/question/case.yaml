schema_version: "1.0"
name: question
description: A question is answered directly - no workflow.
tags: [question, should-not-fire]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    What does tally do today when the input file has an empty line between two numbers? Answer briefly.
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Agent, mcp__sdd__sdd]
  disallowed_tools: [AskUserQuestion]
runs: 2
graders:
  - name: names-the-crash
    type: regex
    pattern: 'ValueError|crash|error'
    flags: i
  - name: no-change-started
    type: tool_used
    tool: mcp__sdd__sdd
    input_match: '"start"'
    min: 0
    max: 0
    arm: both
  - name: no-workflow-agent
    type: regex
    target: trace
    pattern: '"subagent_type":\s*"sdd:'
    match: not_contains
    arm: both
expected_outcome: Says that tally raises ValueError on the empty line, without starting a change.
